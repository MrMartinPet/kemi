<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viljas Musikbegrepp</title>

  <style>
    :root{
      --bg:#eef4f8;
      --card:#ffffff;
      --text:#132033;
      --muted:#667085;
      --blue:#156082;
      --blueLight:#e7f3f7;
      --green:#21803f;
      --yellow:#f6c453;
      --border:#d9e2ea;
      --shadow:0 12px 28px rgba(20,32,51,.12);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:linear-gradient(180deg,#dff0f6 0%,var(--bg) 48%);
      color:var(--text);
    }

    .app{
      height:100dvh;
      max-width:520px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      padding:14px;
      gap:10px;
    }

    header{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .badge{
      background:var(--blueLight);
      color:var(--blue);
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      font-weight:850;
      white-space:nowrap;
    }

    .small{
      color:var(--muted);
      font-size:13px;
      font-weight:650;
    }

    h1{
      margin:0;
      font-size:27px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    h2{
      margin:0 0 8px;
      font-size:24px;
      letter-spacing:-.02em;
    }

    p{
      margin:6px 0;
      line-height:1.35;
    }

    .screen{
      display:none;
      flex:1 1 auto;
      min-height:0;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .screen.active{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menuGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      overflow:auto;
      padding-bottom:2px;
    }

    button{
      border:0;
      border-radius:18px;
      padding:13px 14px;
      font-size:15px;
      font-weight:850;
      background:var(--blue);
      color:white;
      cursor:pointer;
      min-height:48px;
    }

    button.secondary{
      background:#eef2f6;
      color:var(--text);
      border:1px solid var(--border);
    }

    button.green{
      background:var(--green);
    }

    button.yellow{
      background:var(--yellow);
      color:#302400;
    }

    .menuBtn{
      min-height:84px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      text-align:left;
      gap:5px;
    }

    .menuBtn span{
      font-size:12px;
      font-weight:650;
      opacity:.88;
    }

    .navRow{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:auto;
    }

    .counter{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      font-weight:850;
    }

    .flashWrap{
      perspective:1000px;
      flex:1 1 auto;
      min-height:260px;
      display:flex;
    }

    .flashCard{
      width:100%;
      position:relative;
      transform-style:preserve-3d;
      transition:transform .55s cubic-bezier(.2,.8,.2,1);
      cursor:pointer;
      min-height:260px;
    }

    .flashCard.flipped{
      transform:rotateY(180deg);
    }

    .face{
      position:absolute;
      inset:0;
      border-radius:26px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backface-visibility:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:22px;
      overflow:hidden;
    }

    .front{
      background:linear-gradient(180deg,#ffffff,#f7fafc);
    }

    .back{
      background:linear-gradient(180deg,var(--blueLight),#ffffff);
      transform:rotateY(180deg);
    }

    .faceLabel{
      position:absolute;
      top:14px;
      left:14px;
      font-size:12px;
      font-weight:950;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .categoryLabel{
      position:absolute;
      top:14px;
      right:14px;
      font-size:12px;
      font-weight:900;
      background:#eef2f6;
      color:var(--text);
      border-radius:999px;
      padding:5px 8px;
      max-width:48%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .faceText{
      font-size:30px;
      font-weight:950;
      line-height:1.12;
      letter-spacing:-.03em;
      max-width:100%;
    }

    .back .faceText{
      font-size:22px;
      font-weight:850;
    }

    .tapHint{
      position:absolute;
      bottom:14px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
    }

    .progressWrap{
      height:10px;
      background:#e6edf3;
      border-radius:999px;
      overflow:hidden;
    }

    .progress{
      height:100%;
      width:0%;
      background:var(--blue);
      transition:.25s;
    }

    @media(max-width:380px){
      .app{
        padding:10px;
      }

      h1{
        font-size:24px;
      }

      .menuBtn{
        min-height:74px;
      }

      .faceText{
        font-size:26px;
      }

      .back .faceText{
        font-size:19px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="topline">
        <div class="badge">Musik flashcards</div>
        <div class="small" id="headerInfo">Start</div>
      </div>

      <h1>Viljas Musikbegrepp</h1>
      <p class="small">Tryck på kortet. Svara högt. Vänd och kontrollera.</p>
    </header>

    <main id="home" class="screen active">
      <h2>Välj kategori</h2>

      <div class="menuGrid">
        <button class="menuBtn" onclick="startCategory('grunder')">
          Grunder
          <span>Noter, toner, melodi</span>
        </button>

        <button class="menuBtn" onclick="startCategory('klang')">
          Klang
          <span>Dur, moll, ackord</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('grupper')">
          Musiker
          <span>Kör, orkester, solist</span>
        </button>

        <button class="menuBtn green" onclick="startCategory('rytm')">
          Rytm
          <span>Puls, rytm, tempo</span>
        </button>

        <button class="menuBtn yellow" onclick="startCategory('uttryck')">
          Uttryck
          <span>Dynamik, paus, repris</span>
        </button>

        <button class="menuBtn yellow" onclick="startCategory('alla')">
          Alla kort
          <span>Allt blandat</span>
        </button>
      </div>
    </main>

    <section id="cards" class="screen">
      <h2 id="categoryTitle">Flashcards</h2>

      <div class="counter" id="counter">1 av 1</div>

      <div class="progressWrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="flashWrap">
        <div class="flashCard" id="flashCard" onclick="flipCard()">
          <div class="face front">
            <div class="faceLabel">Begrepp</div>
            <div class="categoryLabel" id="frontCategory">Kategori</div>
            <div class="faceText" id="frontText"></div>
            <div class="tapHint">Tryck för att vända</div>
          </div>

          <div class="face back">
            <div class="faceLabel">Förklaring</div>
            <div class="categoryLabel" id="backCategory">Kategori</div>
            <div class="faceText" id="backText"></div>
            <div class="tapHint">Tryck för att vända tillbaka</div>
          </div>
        </div>
      </div>

      <div class="navRow">
        <button class="secondary" onclick="previousCard()">Föregående</button>
        <button onclick="nextCard()">Nästa kort</button>
      </div>

      <button class="secondary" onclick="openHome()">Till meny</button>
    </section>
  </div>

  <script>
    const categories = {
      grunder:{
        title:"Grunder",
        cards:[
          {
            q:"Noter",
            a:"Musikens bokstäver. Ett system för att skriva musik."
          },
          {
            q:"Toner",
            a:"Ljud som kan sjungas eller spelas."
          },
          {
            q:"Tonhöjd",
            a:"Hur hög, ljus, eller låg, mörk, en ton är."
          },
          {
            q:"Melodi",
            a:"En ton i taget som sjungs eller spelas."
          }
        ]
      },

      klang:{
        title:"Klang",
        cards:[
          {
            q:"Ackord",
            a:"Minst tre toner som spelas samtidigt."
          },
          {
            q:"Dur",
            a:"Ackord som låter glatt."
          },
          {
            q:"Moll",
            a:"Ackord som låter sorgset."
          }
        ]
      },

      grupper:{
        title:"Musiker",
        cards:[
          {
            q:"Kör",
            a:"En grupp människor som sjunger tillsammans."
          },
          {
            q:"Orkester",
            a:"En grupp människor som spelar instrument tillsammans."
          },
          {
            q:"Solist",
            a:"En person som sjunger eller spelar ensam."
          }
        ]
      },

      rytm:{
        title:"Rytm",
        cards:[
          {
            q:"Puls",
            a:"Musikens hjärtslag. Det är lika lång tid mellan varje pulsslag."
          },
          {
            q:"Rytm",
            a:"Musikens sväng. En blandning av korta och långa toner och pauser."
          },
          {
            q:"Tempo",
            a:"Musikens hastighet. Hur snabbt eller långsamt pulsen går."
          }
        ]
      },

      uttryck:{
        title:"Uttryck",
        cards:[
          {
            q:"Dynamik",
            a:"Musikens volym. Hur stark eller svag musiken är."
          },
          {
            q:"Paus",
            a:"Ett uppehåll i musiken. Inga toner sjungs eller spelas."
          },
          {
            q:"Repris",
            a:"Att sjunga eller spela samma del av låten en gång till."
          }
        ]
      }
    };

    let activeCards = [];
    let activeTitle = "";
    let currentIndex = 0;

    function openHome(){
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('home').classList.add('active');
      document.getElementById('headerInfo').textContent = 'Start';
    }

    function startCategory(key){
      if(key === 'alla'){
        activeCards = [];

        Object.keys(categories).forEach(categoryKey => {
          categories[categoryKey].cards.forEach(card => {
            activeCards.push({
              q:card.q,
              a:card.a,
              category:categories[categoryKey].title
            });
          });
        });

        activeTitle = "Alla kort";
      }else{
        activeCards = categories[key].cards.map(card => {
          return {
            q:card.q,
            a:card.a,
            category:categories[key].title
          };
        });

        activeTitle = categories[key].title;
      }

      currentIndex = 0;

      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('cards').classList.add('active');
      document.getElementById('headerInfo').textContent = activeTitle;
      document.getElementById('categoryTitle').textContent = activeTitle;

      renderCard();
    }

    function renderCard(){
      const card = activeCards[currentIndex];
      const progress = Math.round(((currentIndex + 1) / activeCards.length) * 100);

      document.getElementById('frontText').textContent = card.q;
      document.getElementById('backText').textContent = card.a;
      document.getElementById('frontCategory').textContent = card.category;
      document.getElementById('backCategory').textContent = card.category;
      document.getElementById('counter').textContent = (currentIndex + 1) + ' av ' + activeCards.length;
      document.getElementById('progress').style.width = progress + '%';
      document.getElementById('flashCard').classList.remove('flipped');
    }

    function flipCard(){
      document.getElementById('flashCard').classList.toggle('flipped');
    }

    function nextCard(){
      currentIndex = (currentIndex + 1) % activeCards.length;
      renderCard();
    }

    function previousCard(){
      currentIndex = (currentIndex - 1 + activeCards.length) % activeCards.length;
      renderCard();
    }
  </script>
</body>
</html>
